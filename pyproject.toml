[project]
name = "know-engine-py"
version = "0.1.0"
description = "Python RAG migration practice project for Know-Engine."
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncmy>=0.2.10",
    "pyyaml>=6.0.3",
    "httpx>=0.27.0",
    "langchain-core>=1.4.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.0",
    "langchain-openai>=1.2.1",
    "langchain-milvus>=0.3.3",
    "langchain-elasticsearch>=1.0.0",
    "celery[redis]>=5.6.3",
    "minio>=7.2.20",
    "sqlglot>=30.8.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "cryptography>=48.0.0",
    "aiohttp>=3.13.5",
    "ragas==0.4.3",
    "langchain-community==0.3.31",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["know_engine_py/tests"]
